<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | Works Manufacturing Office Furniture, Umm Al Quwain</title>
<meta name="description" content="Contact Works Manufacturing Office Furniture in Umm Al Quwain, UAE. Call, WhatsApp or send an enquiry.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<header id="site-header"></header>
<main>
<div class="page-title"><div class="wrap"><div class="eyebrow">Contact</div><h1>Let's talk furniture</h1><p>Tell us what you need – we usually reply the same day.</p></div></div>
<section><div class="wrap two" style="align-items:start">
  <div class="contact-info">
    <p><strong>Phone</strong><a id="c-phone" href="#"></a></p>
    <p><strong>Email</strong><span id="c-email"></span></p>
    <p><strong>Address</strong><span id="c-addr"></span></p>
    <p><strong>Hours</strong><span id="c-hours"></span></p>
    <a class="btn wa" id="c-wa" target="_blank" rel="noopener" href="#">Chat on WhatsApp</a>
  </div>
  <form id="enquiry">
    <label for="name">Your name</label><input id="name" name="name" required autocomplete="name">
    <label for="phone">Phone / WhatsApp</label><input id="phone" name="phone" type="tel" required autocomplete="tel">
    <label for="email">Email (optional)</label><input id="email" name="email" type="email" autocomplete="email">
    <label for="interest">Interested in</label><select id="interest" name="interest"></select>
    <label for="message">Message</label><textarea id="message" name="message" required></textarea>
    <div class="btn-row"><button class="btn" type="submit">Send via WhatsApp</button></div>
  </form>
</div>
<div class="wrap map"><iframe id="map" title="Map – Umm Al Quwain" loading="lazy"></iframe></div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
</body>
</html>
